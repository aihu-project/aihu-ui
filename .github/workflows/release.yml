name: Publish UI registry

on:
  push:
    tags:
      - 'ui-v*'

permissions:
  contents: read

env:
  NPM_REGISTRY: https://registry.npmjs.org

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#ui-v}"
          actual="$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^ui-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be ui-v<stable-semver>; got $RELEASE_TAG"
            exit 1
          fi
          if [[ ! "$actual" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$expected" != "$actual" ]]; then
            echo "::error::tag $RELEASE_TAG must match stable @aihu/ui@$actual"
            exit 1
          fi

  publish:
    name: Publish @aihu/ui
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: ${{ env.NPM_REGISTRY }}
      - run: bun install --frozen-lockfile
      - name: Publish exact version idempotently
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required for the publish job"
            exit 1
          fi
          if ! npm whoami --registry "$NPM_REGISTRY" >/dev/null; then
            echo "::error::NPM_TOKEN is invalid or cannot authenticate to $NPM_REGISTRY"
            exit 1
          fi
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          set +e
          lookup="$(npm view "$package@$version" version --registry "$NPM_REGISTRY" 2>&1)"
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            echo "$package@$version already exists; keeping release idempotent"
            exit 0
          fi
          if ! grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' <<<"$lookup"; then
            echo "::error::npm lookup failed without a confirmed E404"
            printf '%s\n' "$lookup"
            exit 1
          fi
          npm publish . --access public --provenance --registry "$NPM_REGISTRY"
